[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forchat"
version = "0.1.0"
description = "A minimal, decoupled workflow primitive engine (workers, hooks, budgets, event log)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "unfoundname" }]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
forchat = "forchat.__main__:main"

[tool.setuptools.packages.find]
include = ["forchat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
