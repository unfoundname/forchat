name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        if: runner.os == 'Linux'
        run: ruff check forchat tests
      - name: types
        if: runner.os == 'Linux'
        run: mypy
      - name: pytest + coverage
        run: pytest -q --cov=forchat --cov-report=term-missing --cov-fail-under=65
      - name: layering
        run: python tests/test_layering.py
      - name: demo
        run: python examples/run_demo.py
